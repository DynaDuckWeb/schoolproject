<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="relative w-screen h-screen">

    <div id="webgl-container" class="absolute inset-0 z-0"></div>

    <div class="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-lg border border-slate-700/50 shadow-lg pointer-events-none">
        <h1 id="status" class="text-xs font-medium text-slate-300">Loading final.obj...</h1>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>

    <script>
        let scene, camera, renderer, controls, model;

        window.onload = function () 
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const statusEl = document.getElementById('status');
            const loader = new THREE.OBJLoader();

            loader.load(
                './final.obj',
                function (object) {
                    model = object;
                    
                    const box = new THREE.Box3().setFromObject(object);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    object.scale.multiplyScalar(3.0 / maxDim);
                    object.position.sub(center.multiplyScalar(3.0 / maxDim));

                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0x38bdf8,
                                roughness: 0.4,
                                metalness: 0.2
                            });
                        }
                    });

                    scene.add(object);
                    statusEl.textContent = 'final.obj loaded successfully';
                },
                undefined,
                function (error) {
                    console.warn('final.obj not found, loading fallback geometry.', error);
                    statusEl.textContent = 'final.obj not found. Showing fallback shape.';
                    
                    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                    const material = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3 });
                    model = new THREE.Mesh(geometry, material);
                    scene.add(model);
                }
            );

            window.addEventListener('resize', onWindowResize);
 
            animate();
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
